aid: agreable
name: Agreable
description: >-
  Agreable (아그레아블) is a South Korean direct-to-consumer brand-commerce company founded by
  Lim Seung-jin (임승진, "Jason Im") out of a reading-club community of the same name. It has run
  the frozen convenience-food platform Wingeat (윙잇, wingeat.com) since 2015, and in March 2022
  renamed itself after that brand — the operating legal entity is now 주식회사 윙잇 (Wing Eat,
  Inc.) in Guro-gu, Seoul, and agreable.com and agreable.co.kr both redirect to career.wingeat.com.
  The company designs, contract-manufactures and fulfils its own private-label food brands —
  윙잇Dining, 윙잇Made, 고른, 페이보잇, 랠리 and 방아당 — across more than 200 products. It is a
  consumer packaged-goods and retail operator, not a software vendor: it builds its storefront,
  ERP and fulfilment systems in house on private hosts and publishes no developer portal, no
  public API, no SDK, no machine-readable specification and no agent surface of any kind. Its
  GitHub organization, wingeat-inc, carries zero public repositories.
