generated: '2026-09-12'
method: probed
source: >-
  Contract-discovery probes across every Agreable-controlled host on 2026-09-12: career.wingeat.com,
  www.wingeat.com, company.wingeat.com, api.wingeat.com, erp.wingeat.com, abr.wingeat.com,
  agreable.co.kr and agreable.com.
note: >-
  Every entry is asserted from a request actually made, not from a marketing claim. This file is
  almost entirely negative, and that is the finding: Agreable publishes no contract of any kind,
  so there is nothing to conform. It is recorded rather than omitted so a later run can see that
  the surfaces were probed and were genuinely absent, not merely unchecked. No Compliance pointer
  is emitted — no certification or compliance programme is published anywhere.
conformance:
- id: openapi
  conforms: false
  detail: >-
    No OpenAPI or Swagger document is served on any host. /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json, /v2/api-docs, /v3/api-docs, /swagger-ui.html, /api-docs,
    /docs and /redoc were each probed on the storefront, the corporate site and all three
    private application hosts. api.wingeat.com answers "Cannot GET" on every one;
    erp.wingeat.com answers 200 with a Vercel SPA shell on every one, which is not a document.
  evidence: https://api.wingeat.com/openapi.json
- id: graphql
  conforms: false
  detail: /graphql returns 404 on api.wingeat.com and abr.wingeat.com; no introspection surface exists.
  evidence: https://api.wingeat.com/graphql
- id: asyncapi
